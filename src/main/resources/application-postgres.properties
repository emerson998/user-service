# Perfil ativado com SPRING_PROFILES_ACTIVE=postgres — troca o datasource
# principal para PostgreSQL (task 42), com fallback automático para o H2
# em memória (mesma configuração da seção "H2 in-memory database" de
# application.properties) caso a conexão com o Postgres falhe.

app.datasource.primary.url=${POSTGRES_URL}
app.datasource.primary.username=${POSTGRES_USER}
app.datasource.primary.password=${POSTGRES_PASSWORD}
app.datasource.primary.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
