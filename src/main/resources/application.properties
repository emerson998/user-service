spring.application.name=usuarios-service

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:usuariosdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# springdoc / swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator (observabilidade aberta: /actuator/health, /actuator/metrics,
# /actuator/health/readiness e /actuator/health/liveness -- probes.enabled
# ativa os dois grupos mesmo fora de Kubernetes)
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Notificacao de incidentes (chaos-fix-agent) via REST — vazio = desligado
app.chaos.agent-webhook-url=http://localhost:8000/incidents
app.chaos.agent-webhook-timeout-ms=2000

# Identidade do (unico) PSP simulado nesta fase (usuarios-service + pix-service
# juntos formam um PSP so) -- mesmos valores em pix-service e no PSP_ISPB/
# PSP_PARTICIPANT_ID do dict-service. Fase 2 adiciona multiplos participantes.
app.psp.ispb=00000001
app.psp.participant-id=psp-simulado-1
app.psp.type=DIRETO
