spring.application.name=usuarios-service

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:usuariosdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# springdoc / swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# CSV import
app.csv.max-file-size-bytes=5242880

# Auth: TTL (segundos) do token de login guardado no cache authTokens
app.auth.token-ttl-seconds=1800

# Auth: intervalo (ms) do job que expurga tokens expirados do cache authTokens
app.auth.token-cleanup-interval-ms=60000

# Auth: rate limit do endpoint de login (por IP)
app.auth.login-max-attempts=5
app.auth.login-rate-limit-window-seconds=60
